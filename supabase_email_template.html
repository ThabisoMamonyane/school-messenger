<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f7fafc; padding: 40px 20px;">
  <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 40px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0;">
    
    <!-- LOGO SECTION -->
    <div style="text-align: center; margin-bottom: 30px;">
      <!-- IMPORTANT: Upload 'assets/logo.png' to your Supabase Storage (public bucket) and paste the URL here -->
      <img src="https://lqmampbkhwvrfcwkecsg.supabase.co/storage/v1/object/public/Web%20Files/main-logo.png" alt="School Messenger" style="width: 80px; height: auto; border-radius: 14px;">
    </div>

    <h2 style="color: #2d3748; text-align: center; margin-bottom: 16px; font-size: 24px; font-weight: 700;">Confirm your signup</h2>
    
    <p style="color: #4a5568; font-size: 16px; line-height: 26px; text-align: center; margin-bottom: 32px;">
      Welcome to <strong>School Messenger</strong>!<br>
      Please confirm your email address to secure your account and start connecting with your school community.
    </p>

    <div style="text-align: center; margin-bottom: 32px;">
      <a href="{{ .ConfirmationURL }}" style="display: inline-block; background-color: #4a90d9; color: #ffffff; padding: 16px 32px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 16px; box-shadow: 0 4px 12px rgba(74, 144, 217, 0.25);">
        Confirm Email
      </a>
    </div>

    <p style="color: #a0aec0; font-size: 13px; text-align: center; margin-top: 40px; border-top: 1px solid #edf2f7; padding-top: 20px;">
      If you didn't create an account with School Messenger, you can safely ignore this email.
    </p>
  </div>
</body>
</html>
